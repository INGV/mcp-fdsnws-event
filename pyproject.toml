[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-fdsnws-event-server"
version = "2.1.0"
description = "MCP server for the FDSNWS Event API (multi-datacenter)"
authors = [
    {name = "Valentino Lauciani", email = "valentino.lauciani@ingv.it"}
]
dependencies = [
    # This floor is the version of the mcp library, not of this project: a release bump
    # must not rewrite it. mcp 1.7.0 is the first release exposing
    # mcp.types.ToolAnnotations (used by server.py), and mcp.server.fastmcp did not
    # exist before 1.6.0. Any older release fails at import, so the ">=1.0.0" this
    # replaced was never actually satisfiable.
    "mcp>=1.7.0,<2",
    "obspy>=1.4.2,<2",
    "pydantic>=2,<3",
    "requests>=2.31,<3"
]
# 3.11 is what the Docker image ships and what CI tests. The code alone would run
# on 3.9 (PEP 585 generics in runtime-evaluated annotations, asyncio.to_thread) and
# mcp raises the hard floor to 3.10, but 3.10 is untested here so it is not claimed.
requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
mcp-fdsnws-event-server = "fdsnws_event_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit live FDSN datacenters (network required; opt-in)",
]
addopts = "-m 'not integration'"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
